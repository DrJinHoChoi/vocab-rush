name: 수능 문제은행 대량 생성

# 수동 실행(Actions 탭 → Run workflow). 재실행하면 기존 bank-suneung.json 에 이어서 누적.
# 사전 준비: 저장소 Settings → Secrets and variables → Actions 에 ANTHROPIC_API_KEY 추가.
on:
  workflow_dispatch:
    inputs:
      max_new:
        description: '이번 실행에서 추가할 신규 문제 수(상한)'
        required: false
        default: '400'
      target_per_subject:
        description: '과목당 목표 누적 수(총=과목수×목표)'
        required: false
        default: '1000'

permissions:
  contents: write

concurrency:
  group: build-bank
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save @anthropic-ai/sdk
      - name: 생성 + 검증 + 누적
        run: node scripts/build-suneung-bank.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MAX_NEW: ${{ github.event.inputs.max_new }}
          TARGET_PER_SUBJECT: ${{ github.event.inputs.target_per_subject }}
      - name: 커밋·푸시 (자동 배포 트리거)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/daily/bank-suneung.json
          git diff --cached --quiet || git commit -m "수능 문제은행 대량 생성 누적 (build-bank)"
          git pull --rebase --autostash origin main || true
          git push
