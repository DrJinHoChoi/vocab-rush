name: Generate daily problems

on:
  schedule:
    - cron: "0 19 * * *"   # 매일 19:00 UTC = 04:00 KST
  workflow_dispatch: {}     # 수동 실행 버튼

permissions:
  contents: write

concurrency:
  group: daily-problems
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Anthropic SDK
        run: npm install --no-save @anthropic-ai/sdk

      - name: Generate today's problems
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/generate-daily.mjs

      - name: Commit & push
        run: |
          git config user.name "datapd-daily-bot"
          git config user.email "bot@datapd.ai"
          git add public/daily
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "Daily problems $(TZ=Asia/Seoul date +%Y-%m-%d)"
            git push
          fi
