        <h1>STUDY RUSH — 고등학교 국·영·수 수능 학습 게임</h1>
        <p>STUDY RUSH는 국어·영어·수학을 게임으로 공부하며 수능을 준비하는 무료 학습 플랫폼입니다. 회원가입이나 결제 없이 누구나 바로 시작할 수 있습니다.</p>

        <h2>학습 단계: 기초 → 레벨업 → 수능</h2>
        <p>영어 단어, 수학 연산, 국어 어휘·맞춤법 같은 기초를 타이머 게임으로 다지고, 난이도를 올린 뒤, 실제 수능 유형 문제를 제한 시간 안에 푸는 수능 연습 게임으로 마무리합니다.</p>

        <h3>영어 — 어휘 게임 + 수능 독해</h3>
        <p>CEFR 기준 A1(기초)부터 C2(최상급)까지 수준별로 분류한 4,500개 이상의 단어를 발음 듣기·예문·4지선다로 학습합니다. 수능 영어는 빈칸추론·주제·어법 등 유형별 풀이 기술을 다룹니다.</p>

        <h3>수학 — 연산 게임 + 수능 수학</h3>
        <p>덧셈·뺄셈·곱셈·나눗셈·분수·퍼센트·거듭제곱 등 기초 연산을 무한 문제로 훈련합니다. 수능 수학은 수학Ⅰ·수학Ⅱ·확률과 통계의 유형별 풀이를 다룹니다.</p>

        <h3>국어 — 어휘 게임 + 수능 국어</h3>
        <p>맞춤법·띄어쓰기·사자성어·속담·유의어·반의어·높임말·접두사 등으로 어휘력과 어법을 기릅니다. 수능 국어는 독서(비문학)·문학·언어와 매체의 풀이 기술을 다룹니다.</p>

        <h2>수능 연습 게임</h2>
        <p>국어·영어·수학의 실제 수능 유형 문제 58문항을 난이도별 분·초 타이머로 풀어 봅니다. 모든 문제는 저작권 문제가 없는 원본 예시 문항으로, 고등학교 교육과정과 수능 출제 범위에 맞춰 단원별로 구성했습니다.</p>

        <h2>주요 기능</h2>
        <ul>
          <li>3단계 난이도: Easy / Medium / Hard로 제한 시간 조절</li>
          <li>콤보 시스템: 연속 정답 시 보너스 점수</li>
          <li>통계·뱃지: 누적 정답·최고 점수·연속 정답 기록과 도전 과제</li>
          <li>음성 지원: 영어 단어 발음 듣기 (Web Speech API)</li>
          <li>오프라인 지원: PWA로 인터넷 없이도 플레이 가능</li>
        </ul>

        <h2>이런 분들에게 추천합니다</h2>
        <ul>
          <li>수능을 준비하는 고등학교 1·2·3학년과 N수생</li>
          <li>국·영·수 기초 어휘·연산을 빠르게 다지고 싶은 학생</li>
          <li>제한 시간 안에 푸는 실전 감각을 키우고 싶은 수험생</li>
        </ul>

        <p>이 게임을 사용하려면 JavaScript를 활성화해 주세요.</p>
