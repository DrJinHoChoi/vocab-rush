<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/favicon.ico?v=2" sizes="any" />
  <link rel="icon" type="image/svg+xml" href="/doyou-favicon.svg?v=2" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
  <title>입점사 대시보드 · DOYOU 팝업스토어</title>
  <style>
    :root{ --bg:#FAF5EB; --surface:#FFFEFB; --ink:#141413; --line:#E3DCCB; --muted:#7C766B; --muted2:#A79E88; --gold:#F5B60B; --blue:#5B7FA6; --bluetx:#43618A; --terra:#C75D3A; --green:#15803D; --shadow:0 1px 2px rgba(20,16,12,.05), 0 12px 30px rgba(20,16,12,.08); }
    *{ box-sizing:border-box; margin:0; padding:0; }
    body{ font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:var(--bg); color:var(--ink); line-height:1.55; -webkit-font-smoothing:antialiased; }
    .top{ background:var(--surface); border-bottom:2px solid var(--ink); position:sticky; top:0; z-index:20; }
    .top .in{ max-width:860px; margin:0 auto; padding:11px 20px; display:flex; align-items:center; gap:12px; }
    .top .bd{ font-weight:900; font-size:15px; letter-spacing:.3px; color:var(--ink); text-decoration:none; }
    .top .bd .pill{ background:var(--blue); color:#fff; font-size:10px; font-weight:800; letter-spacing:1px; padding:2px 8px; border-radius:999px; margin-left:6px; vertical-align:middle; }
    .top .right{ margin-left:auto; display:flex; align-items:center; gap:12px; }
    .top a.plain{ color:var(--muted); text-decoration:none; font-size:13px; font-weight:700; }
    .btn{ font:inherit; font-weight:800; font-size:13px; padding:8px 14px; border:2px solid var(--ink); border-radius:10px; background:var(--surface); color:var(--ink); cursor:pointer; text-decoration:none; display:inline-block; }
    .btn.blue{ background:var(--blue); color:#fff; }
    .wrap{ max-width:860px; margin:0 auto; padding:26px 20px 60px; }
    .hi{ display:flex; align-items:center; gap:14px; margin-bottom:6px; }
    .ava{ width:54px; height:54px; border-radius:14px; background:var(--ink); color:var(--gold); display:grid; place-items:center; font-weight:900; font-size:22px; flex:0 0 auto; overflow:hidden; }
    .ava img{ width:100%; height:100%; object-fit:cover; }
    .hi h1{ font-size:22px; font-weight:900; letter-spacing:-.01em; }
    .hi .pv{ font-size:12.5px; color:var(--muted); margin-top:2px; }
    .badge{ display:inline-block; font-size:11px; font-weight:800; padding:2px 9px; border-radius:999px; background:var(--bg); border:1px solid var(--line); color:var(--bluetx); margin-left:6px; vertical-align:middle; }
    .modeflag{ font-size:11px; color:var(--muted2); margin:0 0 18px 68px; }
    h2{ font-size:15px; font-weight:900; margin:26px 0 12px; padding-left:11px; border-left:4px solid var(--blue); display:flex; align-items:center; gap:8px; }
    h2 .cta{ margin-left:auto; font-size:12px; font-weight:700; }
    .status{ background:var(--ink); color:#fff; border-radius:16px; padding:18px 20px; box-shadow:var(--shadow); display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
    .status .live{ font-size:11px; font-weight:800; letter-spacing:1px; padding:3px 10px; border-radius:999px; background:var(--green); color:#fff; }
    .status .live.wait{ background:var(--gold); color:#3A2E08; }
    .status .st-main{ font-size:16px; font-weight:900; } .status .st-sub{ font-size:12.5px; color:#C9C3B5; margin-top:2px; }
    .status .st-cta{ margin-left:auto; }
    .tiles{ display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; }
    .tile{ background:var(--surface); border:2px solid var(--ink); border-radius:15px; padding:15px 16px; box-shadow:var(--shadow); }
    .tile .k{ font-size:12px; color:var(--muted); font-weight:700; }
    .tile .v{ font-size:24px; font-weight:900; margin-top:5px; letter-spacing:-.02em; }
    .tile .v small{ font-size:13px; font-weight:700; color:var(--muted2); }
    .list{ display:grid; gap:10px; }
    .row{ display:flex; align-items:center; gap:12px; padding:12px 14px; background:var(--surface); border:2px solid var(--ink); border-radius:12px; text-decoration:none; color:var(--ink); box-shadow:var(--shadow); }
    .row .emo{ font-size:20px; flex:0 0 auto; }
    .row .t{ font-weight:800; font-size:14px; } .row .d{ font-size:12px; color:var(--muted); }
    .row .go{ margin-left:auto; font-weight:900; font-size:12px; }
    .chip{ font-size:11px; font-weight:800; padding:2px 9px; border-radius:999px; border:1px solid var(--line); }
    .chip.ok{ background:#EAF3EC; color:#15803D; border-color:#bcdcc4; }
    .chip.wait{ background:#FBF3E0; color:#8a6d12; border-color:#e7d5a6; }
    .empty{ background:var(--surface); border:2px dashed var(--muted2); border-radius:14px; padding:20px; text-align:center; color:var(--muted); font-size:13.5px; }
    .empty a{ color:var(--bluetx); font-weight:800; }
    .actions{ margin-top:20px; display:flex; gap:10px; flex-wrap:wrap; }
    .note{ font-size:11.5px; color:var(--muted2); margin-top:22px; text-align:center; line-height:1.6; }
    @media(max-width:560px){ .top .in{ padding:11px 16px; } .top a.plain{ display:none; } .modeflag{ margin-left:0; } }
  </style>
</head>
<body>
  <header class="top">
    <div class="in">
      <a class="bd" href="/">DOYOU <span class="pill">입점사 포털</span></a>
      <div class="right">
        <a class="plain" href="/doyou-ops.html">운영 매뉴얼</a>
        <button class="btn" id="logout" type="button">로그아웃</button>
      </div>
    </div>
  </header>

  <main class="wrap" id="main" hidden>
    <div class="hi">
      <div class="ava" id="ava">C</div>
      <div>
        <h1 id="hello">입점사</h1>
        <div class="pv" id="pv"></div>
      </div>
    </div>
    <div class="modeflag" id="modeflag"></div>

    <h2>입점 현황</h2>
    <div id="statusWrap"></div>

    <h2>성과 데이터 <span style="font-weight:700;color:var(--muted2);font-size:12px">이번 주 · 데모</span></h2>
    <div class="tiles">
      <div class="tile"><div class="k">팝업 방문</div><div class="v">1,280<small> 명</small></div></div>
      <div class="tile"><div class="k">게임 참여</div><div class="v">940<small> 회</small></div></div>
      <div class="tile"><div class="k">체험 완료</div><div class="v">610<small> 명</small></div></div>
      <div class="tile"><div class="k">재방문율</div><div class="v">38<small> %</small></div></div>
    </div>

    <h2>내 신청·상담 내역 <a class="cta" href="/doyou-invite.html">+ 입점 신청</a></h2>
    <div id="appsWrap"></div>

    <h2>내 브랜드 콘텐츠 <span style="font-weight:700;color:var(--muted2);font-size:12px">DOYOU 제작</span></h2>
    <div class="list">
      <a class="row" href="/play.html"><span class="emo">⚡</span><div><div class="t">STUDY RUSH</div><div class="d">수능 학습 게임 — 방문객 체험 콘텐츠</div></div><span class="go">→</span></a>
      <a class="row" href="/guides.html"><span class="emo">📖</span><div><div class="t">학습 자료 15편</div><div class="d">원본 가이드 콘텐츠</div></div><span class="go">→</span></a>
      <a class="row" href="/vibe-coding.html"><span class="emo">🤖</span><div><div class="t">생성형 AI 교육</div><div class="d">바이브 코딩 · 본과정</div></div><span class="go">→</span></a>
    </div>

    <div class="actions">
      <button class="btn blue" id="export" type="button">입점 데이터 CSV 내보내기</button>
      <a class="btn" href="/doyou-curation.html">큐레이션 리포트</a>
      <a class="btn" href="/doyou-content.html">콘텐츠 제작 신청</a>
    </div>

    <p class="note" id="note"></p>
  </main>

  <script src="/auth-config.js?v=1"></script>
  <script src="/auth.js?v=2"></script>
  <script>
    (function () {
      var $ = function (id) { return document.getElementById(id); };
      function readJSON(k, fb) { try { return JSON.parse(localStorage.getItem(k)) || fb; } catch (e) { return fb; } }
      function esc(s) { return String(s == null ? '' : s).replace(/[<>&]/g, function (c) { return { '<': '&lt;', '>': '&gt;', '&': '&amp;' }[c]; }); }
      function fmt(ts) { var d = new Date(ts); return isNaN(d) ? '-' : d.getFullYear() + '.' + ('0' + (d.getMonth() + 1)).slice(-2) + '.' + ('0' + d.getDate()).slice(-2); }

      DataPDAuth.getSession().then(function (s) {
        if (!s) { location.replace('/partner-login.html'); return; }
        if (s.role !== 'tenant') { location.replace('/dashboard.html'); return; }  // 일반 회원은 회원 대시보드로
        render(s);
        $('main').hidden = false;
      });

      function render(s) {
        var brand = s.company || s.name || '입점사';
        $('ava').innerHTML = s.picture ? '<img src="' + esc(s.picture) + '" alt="" referrerpolicy="no-referrer">' : esc(brand.charAt(0).toUpperCase());
        $('hello').innerHTML = esc(brand) + ' <span class="badge">입점사</span>';
        $('pv').textContent = (s.name ? s.name + ' · ' : '') + s.email + ' · ' + DataPDAuth.providerLabel(s.provider);
        $('modeflag').textContent = DataPDAuth.mode === 'supabase' ? '● 실제 계정 로그인 (Supabase)' : '● 데모 모드 — 이 브라우저에만 저장';

        // 입점 현황: 신청 데이터가 있으면 그걸로, 없으면 신청 유도
        var apps = readJSON('doyou.apply.v1', []);
        var joins = readJSON('doyou.join.v1', []);
        var latest = apps[apps.length - 1];
        if (latest) {
          $('statusWrap').innerHTML = '<div class="status"><span class="live">● 입점 확정</span>' +
            '<div><div class="st-main">' + esc(latest.brand || brand) + ' · DOYOU 범어 본점</div>' +
            '<div class="st-sub">' + esc(latest.category || '-') + (latest.zone ? ' · ' + esc(latest.zone) : '') +
            (latest.slot ? ' · ' + esc(latest.slot) : '') + (latest.fitTier ? ' · ' + esc(latest.fitTier) : '') + '</div></div>' +
            '<a class="btn st-cta" href="/doyou-precon.html">공간 시안 보기</a></div>';
        } else {
          $('statusWrap').innerHTML = '<div class="status"><span class="live wait">준비 중</span>' +
            '<div><div class="st-main">아직 입점 신청이 없어요</div><div class="st-sub">입점 신청을 하면 여기에서 현황·성과를 관리합니다.</div></div>' +
            '<a class="btn st-cta" href="/doyou-invite.html">입점 신청 →</a></div>';
        }

        // 신청·상담 내역
        var rows = [];
        apps.forEach(function (a) {
          rows.push(row('🏬', esc(a.brand || brand), '입점 신청 · ' + esc(a.category || '-') + (a.zone ? ' · ' + esc(a.zone) : '') + ' · ' + fmt(a.ts),
            a.fitTier ? '<span class="chip ok">' + esc(a.fitTier) + '</span>' : '<span class="chip wait">접수됨</span>'));
        });
        joins.forEach(function (j) {
          rows.push(row('🤝', esc(j.name || brand), '가맹 상담 · ' + esc(j.type || '-') + (j.area ? ' · ' + esc(j.area) : '') + ' · ' + fmt(j.ts), '<span class="chip wait">상담 대기</span>'));
        });
        $('appsWrap').innerHTML = rows.length ? '<div class="list">' + rows.join('') + '</div>'
          : emptyBox('아직 신청·상담 내역이 없어요.', '/doyou-invite.html', '입점 신청하기 →');

        $('note').innerHTML = '성과 데이터는 데모 예시입니다. 실제 팝업 운영 시 방문·게임·체험 데이터가 연동됩니다.';

        $('export').onclick = function () {
          var out = [['구분', '항목', '값'], ['입점사', '브랜드', brand], ['입점사', '담당자', s.name || ''], ['입점사', '이메일', s.email]];
          apps.forEach(function (a, i) { out.push(['입점신청 ' + (i + 1), a.brand || brand, (a.category || '') + '/' + (a.zone || '') + '/' + fmt(a.ts)]); });
          joins.forEach(function (j, i) { out.push(['가맹상담 ' + (i + 1), j.name || '', (j.type || '') + '/' + (j.area || '') + '/' + fmt(j.ts)]); });
          var csv = '﻿' + out.map(function (r) { return r.map(function (c) { return '"' + String(c).replace(/"/g, '""') + '"'; }).join(','); }).join('\n');
          var url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
          var a = document.createElement('a'); a.href = url; a.download = 'doyou-입점사-' + brand + '.csv'; a.click();
          URL.revokeObjectURL(url);
        };
      }

      function row(emo, t, d, chip) { return '<div class="row"><span class="emo">' + emo + '</span><div><div class="t">' + t + '</div><div class="d">' + d + '</div></div><span class="go">' + (chip || '') + '</span></div>'; }
      function emptyBox(text, href, cta) { return '<div class="empty">' + text + '<br/><a href="' + href + '">' + cta + '</a></div>'; }

      $('logout').onclick = function () { DataPDAuth.signOut().then(function () { location.href = '/partner-login.html'; }); };
    })();
  </script>
</body>
</html>
