<svg viewBox="0 0 720 550" xmlns="http://www.w3.org/2000/svg" font-family="'Pretendard','Malgun Gothic','Apple SD Gothic Neo',sans-serif" role="img" aria-label="최박사사진관 공간 구성안: 가로 7.3m, 세로 4.5m, 10평. 왼쪽 벽 메인 촬영 세트, 오른쪽 위 증명사진 부스, 위쪽 가운데 파우더·소품, 오른쪽 아래 출입구 옆 셀렉·원본 인증서 발급 스테이션.">
  <defs>
    <marker id="dm" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M2,2 L8,8" stroke="#0F0F0E" stroke-width="1.2"/></marker>
    <marker id="fl" markerWidth="8" markerHeight="8" refX="4.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#C8321D"/></marker>
  </defs>
  <rect width="720" height="550" fill="#FFFFFF"/>

  <!-- title -->
  <text x="30" y="40" font-size="16" font-weight="800" fill="#0F0F0E" letter-spacing="-0.3">공간 구성안 · 10평 셀프 스튜디오</text>
  <text x="30" y="60" font-family="Consolas,'IBM Plex Mono',monospace" font-size="11" fill="#5C5C58" letter-spacing="1.2">STUDIO LAYOUT (DRAFT) · 7.3 × 4.5 m · 대구 범어</text>
  <g transform="translate(662,52)"><circle r="15" fill="none" stroke="#0F0F0E" stroke-width="1.2"/><path d="M0,-12 L4.5,4 L0,-1 L-4.5,4 Z" fill="#0F0F0E"/><text y="-19" text-anchor="middle" font-size="10" font-weight="800" fill="#0F0F0E">N</text></g>

  <!-- 1 m grid -->
  <g stroke="#ECECE6" stroke-width="0.8">
    <line x1="180" y1="110" x2="180" y2="380"/><line x1="240" y1="110" x2="240" y2="380"/><line x1="300" y1="110" x2="300" y2="380"/><line x1="360" y1="110" x2="360" y2="380"/><line x1="420" y1="110" x2="420" y2="380"/><line x1="480" y1="110" x2="480" y2="380"/><line x1="540" y1="110" x2="540" y2="380"/>
    <line x1="120" y1="170" x2="558" y2="170"/><line x1="120" y1="230" x2="558" y2="230"/><line x1="120" y1="290" x2="558" y2="290"/><line x1="120" y1="350" x2="558" y2="350"/>
  </g>

  <!-- walls (poché) -->
  <path d="M110 100 H568 V390 H110 Z M120 110 V380 H558 V110 Z" fill="#0F0F0E" fill-rule="evenodd"/>

  <!-- A: main set — backdrop roll on the west wall + shooting floor -->
  <rect x="120" y="150" width="14" height="190" fill="#B9BFB1"/>
  <rect x="138" y="150" width="162" height="190" fill="#F4F4F1" stroke="#9C9C96" stroke-width="1" stroke-dasharray="4 3"/>
  <g fill="#0F0F0E"><rect x="196" y="124" width="40" height="12" rx="2"/><rect x="196" y="354" width="40" height="12" rx="2"/></g>
  <g stroke="#C9C9C2" stroke-width="1"><line x1="200" y1="136" x2="150" y2="190"/><line x1="232" y1="136" x2="176" y2="198"/><line x1="200" y1="354" x2="150" y2="300"/><line x1="232" y1="354" x2="176" y2="292"/></g>
  <text x="219" y="238" text-anchor="middle" font-size="13" font-weight="800" fill="#0F0F0E">A 메인 촬영 세트</text>
  <text x="219" y="255" text-anchor="middle" font-size="10.5" fill="#5C5C58">배경지 롤 · 조명 2등</text>

  <!-- camera + monitor (self shutter) -->
  <g stroke="#0F0F0E" stroke-width="1.6"><line x1="330" y1="245" x2="318" y2="262"/><line x1="330" y1="245" x2="342" y2="262"/><line x1="330" y1="245" x2="330" y2="228"/></g>
  <circle cx="330" cy="245" r="6" fill="#0F0F0E"/>
  <rect x="348" y="236" width="44" height="18" fill="#FFFFFF" stroke="#0F0F0E" stroke-width="1.4"/>
  <text x="352" y="274" font-size="10" font-weight="700" fill="#0F0F0E">카메라 · 대형 모니터</text>
  <text x="352" y="288" font-size="9.5" fill="#5C5C58">리모컨 셔터로 셀프 촬영</text>

  <!-- B: ID photo booth -->
  <rect x="455" y="110" width="103" height="95" fill="#EDEDE8" stroke="#9C9C96" stroke-width="1"/>
  <line x1="455" y1="205" x2="522" y2="205" stroke="#5C5C58" stroke-width="2.2" stroke-dasharray="3 3"/>
  <circle cx="506" cy="146" r="9" fill="#FFFFFF" stroke="#0F0F0E" stroke-width="1.4"/>
  <text x="506" y="176" text-anchor="middle" font-size="11.5" font-weight="800" fill="#0F0F0E">B 증명·여권 부스</text>
  <text x="506" y="191" text-anchor="middle" font-size="9.5" fill="#5C5C58">커튼 · 규격 배경</text>

  <!-- C: powder & props -->
  <rect x="330" y="110" width="112" height="58" fill="#F4F4F1" stroke="#9C9C96" stroke-width="1" stroke-dasharray="4 3"/>
  <rect x="334" y="112" width="104" height="13" fill="#FFFFFF" stroke="#0F0F0E" stroke-width="1.2"/>
  <text x="386" y="146" text-anchor="middle" font-size="11.5" font-weight="800" fill="#0F0F0E">C 파우더·소품</text>
  <text x="386" y="160" text-anchor="middle" font-size="9.5" fill="#5C5C58">거울 · 소품 선반</text>

  <!-- D: select & certificate station (the service's core) -->
  <rect x="366" y="330" width="92" height="42" fill="#FFFFFF" stroke="#C8321D" stroke-width="1.8"/>
  <rect x="374" y="339" width="28" height="16" fill="#0F0F0E"/>
  <rect x="422" y="339" width="26" height="18" fill="#D6D6CF" stroke="#0F0F0E" stroke-width="1"/>
  <text x="412" y="321" text-anchor="middle" font-size="11" font-weight="800" fill="#C8321D">D 셀렉 · 원본 인증서 발급</text>
  <text x="412" y="368" text-anchor="middle" font-size="8.5" fill="#5C5C58">PC · 포토 프린터</text>

  <!-- E: waiting bench -->
  <rect x="536" y="228" width="20" height="70" fill="#EDEDE8" stroke="#9C9C96" stroke-width="1"/>
  <text x="546" y="263" text-anchor="middle" font-size="10" font-weight="700" fill="#0F0F0E" transform="rotate(90,546,263)">E 대기</text>

  <!-- entrance: bottom wall, right end (street side) -->
  <rect x="470" y="380" width="54" height="10" fill="#FFFFFF"/>
  <line x1="470" y1="380" x2="470" y2="326" stroke="#0F0F0E" stroke-width="1.6"/>
  <path d="M470,326 A54,54 0 0,1 524,380" fill="none" stroke="#9C9C96" stroke-width="1"/>
  <text x="497" y="410" text-anchor="middle" font-size="11" font-weight="800" fill="#0F0F0E">출입구 · 도로측</text>

  <!-- visitor flow: in → powder → set / booth → select & certificate → out -->
  <path d="M492 372 C492 320 470 248 425 196 C392 168 322 184 306 214 C292 244 296 300 356 350" fill="none" stroke="#C8321D" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#fl)"/>

  <!-- dimensions -->
  <g stroke="#0F0F0E" stroke-width="0.8"><line x1="110" y1="390" x2="110" y2="432"/><line x1="568" y1="390" x2="568" y2="432"/><line x1="110" y1="426" x2="568" y2="426" marker-start="url(#dm)" marker-end="url(#dm)"/></g>
  <rect x="302" y="418" width="74" height="15" fill="#FFFFFF"/>
  <text x="339" y="430" text-anchor="middle" font-family="Consolas,'IBM Plex Mono',monospace" font-size="11" font-weight="700" fill="#0F0F0E">7,300</text>
  <g stroke="#0F0F0E" stroke-width="0.8"><line x1="110" y1="100" x2="72" y2="100"/><line x1="110" y1="390" x2="72" y2="390"/><line x1="80" y1="100" x2="80" y2="390" marker-start="url(#dm)" marker-end="url(#dm)"/></g>
  <rect x="72" y="208" width="16" height="74" fill="#FFFFFF"/>
  <text x="80" y="245" text-anchor="middle" font-family="Consolas,'IBM Plex Mono',monospace" font-size="11" font-weight="700" fill="#0F0F0E" transform="rotate(-90,80,245)">4,500</text>

  <!-- legend -->
  <line x1="30" y1="458" x2="690" y2="458" stroke="#D6D6CF"/>
  <g font-size="11" fill="#2A2A28">
    <text x="30" y="482"><tspan font-weight="800">A</tspan> 메인 세트 — 가족·프로필·반려동물·제품</text>
    <text x="370" y="482"><tspan font-weight="800">B</tspan> 증명·여권·취업 사진 부스</text>
    <text x="30" y="502"><tspan font-weight="800">C</tspan> 파우더·소품</text>
    <text x="370" y="502"><tspan font-weight="800" fill="#C8321D">D</tspan> 컷 셀렉 → 원본 인증서 발급 → 인화</text>
    <text x="30" y="522"><tspan font-weight="800">E</tspan> 대기</text>
    <text x="370" y="522" fill="#5C5C58">점선 = 방문 동선 · 단위 mm · 시안(변경 가능)</text>
  </g>
</svg>
