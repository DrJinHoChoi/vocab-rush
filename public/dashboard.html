<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/favicon.ico?v=2" sizes="any" />
  <link rel="icon" type="image/svg+xml" href="/doyou-favicon.svg?v=2" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
  <title>내 데이터 · DataPD</title>
  <style>
    :root{ --bg:#FAF5EB; --surface:#FFFEFB; --ink:#141413; --line:#E3DCCB; --muted:#7C766B; --muted2:#A79E88; --gold:#F5B60B; --blue:#5B7FA6; --bluetx:#43618A; --terra:#C75D3A; --green:#15803D; --shadow:0 1px 2px rgba(20,16,12,.05), 0 12px 30px rgba(20,16,12,.08); }
    *{ box-sizing:border-box; margin:0; padding:0; }
    body{ font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:var(--bg); color:var(--ink); line-height:1.55; -webkit-font-smoothing:antialiased; }
    .top{ background:var(--surface); border-bottom:2px solid var(--ink); position:sticky; top:0; z-index:20; }
    .top .in{ max-width:840px; margin:0 auto; padding:11px 20px; display:flex; align-items:center; gap:12px; }
    .top .bd{ font-weight:900; font-size:16px; letter-spacing:.5px; color:var(--ink); text-decoration:none; }
    .top .bd span{ color:var(--muted2); font-weight:700; font-size:13px; }
    .top .right{ margin-left:auto; display:flex; align-items:center; gap:12px; }
    .top a.plain{ color:var(--muted); text-decoration:none; font-size:13px; font-weight:700; }
    .btn{ font:inherit; font-weight:800; font-size:13px; padding:8px 14px; border:2px solid var(--ink); border-radius:10px; background:var(--surface); color:var(--ink); cursor:pointer; text-decoration:none; }
    .btn.gold{ background:var(--gold); }
    .wrap{ max-width:840px; margin:0 auto; padding:26px 20px 60px; }
    .hi{ display:flex; align-items:center; gap:14px; margin-bottom:22px; }
    .ava{ width:52px; height:52px; border-radius:50%; background:var(--ink); color:var(--gold); display:grid; place-items:center; font-weight:900; font-size:22px; flex:0 0 auto; }
    .hi h1{ font-size:22px; font-weight:900; letter-spacing:-.01em; }
    .hi .pv{ font-size:12.5px; color:var(--muted); margin-top:2px; }
    .badge{ display:inline-block; font-size:11px; font-weight:800; padding:2px 9px; border-radius:999px; background:var(--bg); border:1px solid var(--line); color:var(--bluetx); margin-left:6px; vertical-align:middle; }
    h2{ font-size:15px; font-weight:900; margin:26px 0 12px; padding-left:11px; border-left:4px solid var(--gold); }
    .tiles{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; }
    .tile{ background:var(--surface); border:2px solid var(--ink); border-radius:15px; padding:15px 16px; box-shadow:var(--shadow); }
    .tile .k{ font-size:12px; color:var(--muted); font-weight:700; }
    .tile .v{ font-size:24px; font-weight:900; margin-top:5px; letter-spacing:-.02em; }
    .tile .v small{ font-size:13px; font-weight:700; color:var(--muted2); }
    .panel{ background:var(--surface); border:2px solid var(--ink); border-radius:18px; padding:20px; box-shadow:var(--shadow); }
    .bars{ display:grid; gap:9px; }
    .bar{ display:grid; grid-template-columns:34px 1fr 30px; align-items:center; gap:10px; font-size:13px; }
    .bar .lab{ color:var(--muted); font-weight:700; }
    .bar .track{ height:14px; background:var(--bg); border:1px solid var(--line); border-radius:7px; overflow:hidden; }
    .bar .fill{ height:100%; background:var(--gold); border-right:2px solid var(--ink); }
    .bar .num{ text-align:right; font-weight:800; color:var(--ink); }
    .list{ display:grid; gap:10px; }
    .row{ display:flex; align-items:center; gap:12px; padding:12px 14px; background:var(--bg); border:2px solid var(--ink); border-radius:12px; text-decoration:none; color:var(--ink); }
    .row .emo{ font-size:20px; }
    .row .t{ font-weight:800; font-size:14px; } .row .d{ font-size:12px; color:var(--muted); }
    .row .go{ margin-left:auto; color:var(--terra); font-weight:900; }
    .note{ font-size:11.5px; color:var(--muted2); margin-top:22px; text-align:center; line-height:1.6; }
    @media(max-width:560px){ .top .in{ padding:11px 16px; } .top a.plain{ display:none; } }
  </style>
</head>
<body>
  <header class="top">
    <div class="in">
      <a class="bd" href="/">DataPD <span>· 내 데이터</span></a>
      <div class="right">
        <a class="plain" href="/#doyou">DOYOU 팝업</a>
        <button class="btn" id="logout" type="button">로그아웃</button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <div class="hi">
      <div class="ava" id="ava">D</div>
      <div>
        <h1 id="hello">안녕하세요</h1>
        <div class="pv" id="pv"></div>
      </div>
    </div>

    <div class="tiles">
      <div class="tile"><div class="k">가입 경로</div><div class="v" id="tProvider">–</div></div>
      <div class="tile"><div class="k">가입일</div><div class="v" id="tJoined">–</div></div>
      <div class="tile"><div class="k">관심 카테고리</div><div class="v">교육</div></div>
      <div class="tile"><div class="k">저장한 항목</div><div class="v" id="tSaved">3<small> 개</small></div></div>
    </div>

    <h2>주간 활동 <span style="font-weight:700;color:var(--muted2);font-size:12px">(데모 데이터)</span></h2>
    <div class="panel">
      <div class="bars" id="bars"></div>
    </div>

    <h2>저장한 항목</h2>
    <div class="list">
      <a class="row" href="/play.html">
        <span class="emo">⚡</span>
        <div><div class="t">STUDY RUSH</div><div class="d">수능 학습 게임 · 입점사 crabox.ai</div></div>
        <span class="go">→</span>
      </a>
      <a class="row" href="/guides.html">
        <span class="emo">📖</span>
        <div><div class="t">학습 자료 15편</div><div class="d">원본 가이드 · 독해·풀이 기술</div></div>
        <span class="go">→</span>
      </a>
      <a class="row" href="/doyou-partners.html">
        <span class="emo">🦀</span>
        <div><div class="t">crabox.ai</div><div class="d">DOYOU 범어 본점 입점사 #1</div></div>
        <span class="go">→</span>
      </a>
    </div>

    <div style="margin-top:18px;display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn gold" id="export" type="button">내 데이터 CSV 내보내기</button>
      <a class="btn" href="/doyou-invite.html">입점 브랜드 둘러보기</a>
    </div>

    <p class="note">이 페이지의 활동·항목 데이터는 데모입니다.<br/>실제 서비스에서는 로그인한 계정의 실제 데이터가 표시됩니다.</p>
  </main>

  <script src="/auth.js?v=1"></script>
  <script>
    (function () {
      var s = window.DataPDAuth && DataPDAuth.session();
      if (!s) { location.replace('/login.html'); return; }

      function fmt(ts){ var d = new Date(ts); return d.getFullYear() + '.' + ('0'+(d.getMonth()+1)).slice(-2) + '.' + ('0'+d.getDate()).slice(-2); }
      var initial = (s.name || s.email || 'D').trim().charAt(0).toUpperCase();

      document.getElementById('ava').textContent = initial;
      document.getElementById('hello').innerHTML = s.name + '님 <span class="badge">' + DataPDAuth.providerLabel(s.provider) + '</span>';
      document.getElementById('pv').textContent = s.email;
      document.getElementById('tProvider').textContent = DataPDAuth.providerLabel(s.provider);
      document.getElementById('tJoined').textContent = fmt(s.at);

      // 주간 활동 막대(데모, 결정적 값)
      var days = ['월','화','수','목','금','토','일'];
      var vals = [4, 7, 5, 9, 6, 8, 3];
      var max = Math.max.apply(null, vals);
      document.getElementById('bars').innerHTML = days.map(function (d, i) {
        var pct = Math.round(vals[i] / max * 100);
        return '<div class="bar"><span class="lab">' + d + '</span>' +
          '<span class="track"><span class="fill" style="width:' + pct + '%"></span></span>' +
          '<span class="num">' + vals[i] + '</span></div>';
      }).join('');

      document.getElementById('logout').onclick = function () { DataPDAuth.logOut(); location.href = '/login.html'; };

      document.getElementById('export').onclick = function () {
        var rows = [['항목','값'],
          ['이름', s.name], ['이메일', s.email],
          ['가입 경로', DataPDAuth.providerLabel(s.provider)], ['가입일', fmt(s.at)]];
        days.forEach(function (d, i) { rows.push(['활동_' + d, vals[i]]); });
        var csv = '﻿' + rows.map(function (r) { return r.join(','); }).join('\n');
        var url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
        var a = document.createElement('a'); a.href = url; a.download = 'datapd-내데이터.csv'; a.click();
        URL.revokeObjectURL(url);
      };
    })();
  </script>
</body>
</html>
