<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#FAF5EB">
  <title>광고 리포트 - STUDY RUSH</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #FAF5EB;
      color: #141413;
      font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
      line-height: 1.6;
    }

    /* Header bar */
    .topbar {
      background: #FFFEFB;
      border-bottom: 1px solid #E3DCCB;
      padding: 12px 20px;
    }
    .topbar-inner {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 14px;
    }
    .brand {
      font-weight: 900;
      font-size: 18px;
      color: #141413;
      text-decoration: none;
      letter-spacing: 0.3px;
    }
    .brand-sub { color: #6E6657; font-size: 14px; font-weight: 600; }
    .nav-links { margin-left: auto; display: flex; gap: 14px; flex-wrap: wrap; }
    .nav-links a {
      font-size: 13px;
      color: #43618A;
      text-decoration: none;
      font-weight: 600;
    }
    .nav-links a:hover { text-decoration: underline; }

    /* Layout */
    .wrap { max-width: 900px; margin: 0 auto; padding: 20px 16px 60px; }
    h1 { font-size: 22px; font-weight: 800; margin-bottom: 4px; }
    .page-sub { color: #7C766B; font-size: 14px; margin-bottom: 16px; }

    .note {
      background: #FBF8F0;
      border: 1px solid #E3DCCB;
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 13px;
      color: #6E6657;
      margin-bottom: 18px;
      line-height: 1.55;
    }

    /* Metric cards */
    .metrics {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }
    .card {
      background: #FFFEFB;
      border: 1px solid #E3DCCB;
      border-radius: 14px;
      padding: 16px;
    }
    .metric .m-label { font-size: 13px; color: #7C766B; font-weight: 600; margin-bottom: 6px; }
    .metric .m-value { font-size: 28px; font-weight: 800; color: #141413; line-height: 1.2; }
    .metric .m-value.accent-gold { color: #F5B60B; }
    .metric .m-value.accent-blue { color: #43618A; }
    .metric .m-value.accent-terra { color: #C75D3A; }

    /* Controls */
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-bottom: 18px;
    }
    .ctl-label { font-size: 13px; color: #7C766B; font-weight: 700; margin-right: 4px; }
    .btn {
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      padding: 8px 14px;
      border-radius: 10px;
      border: 1px solid #E3DCCB;
      background: #FFFEFB;
      color: #141413;
      cursor: pointer;
      transition: background .12s, border-color .12s;
    }
    .btn:hover { background: #FBF8F0; }
    .btn.active {
      background: #43618A;
      border-color: #43618A;
      color: #FFFEFB;
    }
    .spacer { flex: 1 1 auto; }
    .btn.ghost { color: #43618A; }
    .btn.danger { color: #DC2626; border-color: #E8C9C3; }
    .btn.danger:hover { background: #FBEDEA; }

    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 22px; }

    /* Sections */
    .section { margin-bottom: 22px; }
    .section h2 {
      font-size: 16px;
      font-weight: 800;
      margin-bottom: 4px;
    }
    .section .sec-sub { font-size: 12.5px; color: #7C766B; margin-bottom: 12px; }

    /* Legend */
    .legend { display: flex; gap: 16px; font-size: 12px; color: #6E6657; margin-bottom: 12px; flex-wrap: wrap; }
    .legend span { display: inline-flex; align-items: center; gap: 6px; }
    .swatch { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
    .sw-gold { background: #F5B60B; }
    .sw-terra { background: #C75D3A; }

    /* Bar chart rows */
    .bar-row { margin-bottom: 14px; }
    .bar-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 5px;
      font-size: 13px;
    }
    .bar-name { font-weight: 700; color: #141413; }
    .bar-meta { font-size: 12px; color: #7C766B; }
    .track {
      position: relative;
      background: #FBF8F0;
      border-radius: 7px;
      height: 14px;
      overflow: hidden;
      margin-bottom: 4px;
    }
    .fill {
      position: absolute;
      left: 0; top: 0; bottom: 0;
      border-radius: 7px;
      min-width: 2px;
      transition: width .35s ease;
    }
    .fill-gold { background: #F5B60B; }
    .fill-terra { background: #C75D3A; }
    .bar-line {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
    }
    .bar-line .track { flex: 1 1 auto; margin-bottom: 0; }
    .bar-line .val {
      font-size: 12px;
      font-weight: 700;
      color: #141413;
      min-width: 42px;
      text-align: right;
    }
    .bar-line .tag {
      font-size: 11px;
      font-weight: 600;
      color: #7C766B;
      min-width: 30px;
    }

    /* Tables */
    .tbl-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: right; padding: 9px 10px; border-bottom: 1px solid #E3DCCB; white-space: nowrap; }
    th:first-child, td:first-child { text-align: left; }
    thead th { color: #6E6657; font-weight: 700; font-size: 12px; background: #FBF8F0; }
    tbody tr:last-child td { border-bottom: none; }
    .ctr-pill {
      display: inline-block;
      font-size: 11.5px;
      font-weight: 700;
      color: #15803D;
      background: #ECF6EE;
      border-radius: 6px;
      padding: 1px 7px;
    }

    /* Day grid: chart on one card */
    .day-bar { margin-bottom: 9px; }
    .day-bar .bar-line .tag { min-width: 64px; font-size: 11.5px; }

    /* Empty state */
    .empty {
      text-align: center;
      padding: 48px 20px;
      color: #7C766B;
    }
    .empty .big { font-size: 40px; margin-bottom: 10px; }
    .empty h3 { font-size: 17px; color: #141413; font-weight: 800; margin-bottom: 8px; }
    .empty p { font-size: 13.5px; max-width: 380px; margin: 0 auto 18px; line-height: 1.6; }

    .demo-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      color: #C75D3A;
      background: #FBEDEA;
      border: 1px solid #E8C9C3;
      border-radius: 6px;
      padding: 2px 8px;
      margin-left: 8px;
      vertical-align: middle;
    }
    .demo-badge.hidden { display: none; }

    .muted-small { font-size: 12px; color: #7C766B; }
    .footnote { font-size: 11.5px; color: #7C766B; margin-top: 8px; }

    @media (max-width: 480px) {
      .metric .m-value { font-size: 24px; }
      h1 { font-size: 20px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/">STUDY RUSH</a>
      <span class="brand-sub">· 광고 리포트</span>
      <nav class="nav-links">
        <a href="/suneung-quiz.html">키오스크 게임</a>
        <a href="/ad-admin.html">광고 관리</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <h1>광고 노출 리포트<span id="demoBadge" class="demo-badge hidden">데모(예시) 데이터</span></h1>
    <p class="page-sub">이 기기에 기록된 광고 노출·클릭 현황입니다.</p>

    <div class="note">
      ※ 이 기기(브라우저)에 기록된 노출만 표시됩니다. 전국 키오스크 통합 집계는 서버 수집(/ad-event) 연동 후 제공됩니다.
    </div>

    <!-- Date range filter -->
    <div class="controls" id="rangeControls">
      <span class="ctl-label">기간</span>
      <button class="btn" data-range="7">최근 7일</button>
      <button class="btn" data-range="30">최근 30일</button>
      <button class="btn" data-range="all">전체</button>
    </div>

    <!-- Summary metrics -->
    <section class="metrics" id="metrics"></section>

    <!-- Main report (hidden when empty) -->
    <div id="report"></div>

    <!-- Empty state -->
    <div id="emptyState" style="display:none"></div>

    <!-- Actions -->
    <div class="actions">
      <button class="btn ghost" id="btnCsv">CSV 내보내기</button>
      <button class="btn" id="btnDemo">데모 데이터 채우기</button>
      <button class="btn danger" id="btnClear">로그 비우기</button>
    </div>

    <p class="footnote">저장 위치: 브라우저 localStorage <code>srush.adlog</code> · 최대 800건 보관</p>
  </main>

  <script>
  (function () {
    'use strict';

    var LS_KEY = 'srush.adlog';

    // slot key -> Korean label
    var SLOT_LABELS = {
      bottom: '하단 띠배너',
      result: '결과 카드',
      interstitial: '전면 광고'
    };
    var SLOT_ORDER = ['bottom', 'result', 'interstitial'];

    var DAY_MS = 24 * 60 * 60 * 1000;
    var currentRange = '7'; // '7' | '30' | 'all'

    // ---------- data access ----------
    function loadLog() {
      try {
        var raw = localStorage.getItem(LS_KEY);
        if (!raw) return [];
        var arr = JSON.parse(raw);
        if (!Array.isArray(arr)) return [];
        // keep only well-formed records
        return arr.filter(function (r) {
          return r && typeof r === 'object' && typeof r.t === 'number';
        });
      } catch (e) {
        return [];
      }
    }

    function saveLog(arr) {
      try {
        localStorage.setItem(LS_KEY, JSON.stringify(arr));
      } catch (e) {}
    }

    function filterByRange(log, range) {
      if (range === 'all') return log.slice();
      var days = parseInt(range, 10);
      var cutoff = Date.now() - days * DAY_MS;
      return log.filter(function (r) { return r.t >= cutoff; });
    }

    // ---------- helpers ----------
    function fmt(n) { return Number(n || 0).toLocaleString('ko-KR'); }

    function ctr(clicks, imps) {
      if (!imps) return 0;
      return (clicks / imps) * 100;
    }
    function ctrText(clicks, imps) {
      return ctr(clicks, imps).toFixed(1) + '%';
    }

    function esc(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // local (KST on this machine) YYYY-MM-DD key
    function dayKey(t) {
      var d = new Date(t);
      var m = (d.getMonth() + 1);
      var day = d.getDate();
      return d.getFullYear() + '-' + (m < 10 ? '0' + m : m) + '-' + (day < 10 ? '0' + day : day);
    }
    function dayLabel(key) {
      // key 'YYYY-MM-DD' -> 'MM.DD'
      var p = key.split('-');
      return p[1] + '.' + p[2];
    }

    // ---------- aggregation ----------
    function aggregate(rows) {
      var totalImp = 0, totalClick = 0;
      var advMap = {};   // adv -> {imp, click}
      var slotMap = {};  // slot -> {imp, click}
      var advSet = {};

      SLOT_ORDER.forEach(function (s) { slotMap[s] = { imp: 0, click: 0 }; });

      rows.forEach(function (r) {
        var isClick = r.ev === 'click';
        var isImp = r.ev === 'impression';
        var adv = r.adv || '(광고주 미상)';
        var slot = SLOT_ORDER.indexOf(r.slot) >= 0 ? r.slot : null;

        if (isImp) totalImp++;
        if (isClick) totalClick++;

        if (isImp || isClick) {
          advSet[adv] = true;
          if (!advMap[adv]) advMap[adv] = { imp: 0, click: 0 };
          if (isImp) advMap[adv].imp++;
          if (isClick) advMap[adv].click++;
          if (slot) {
            if (isImp) slotMap[slot].imp++;
            if (isClick) slotMap[slot].click++;
          }
        }
      });

      // advertisers array sorted by impressions desc
      var advList = Object.keys(advMap).map(function (k) {
        return { name: k, imp: advMap[k].imp, click: advMap[k].click };
      }).sort(function (a, b) { return b.imp - a.imp || b.click - a.click; });

      return {
        totalImp: totalImp,
        totalClick: totalClick,
        advCount: Object.keys(advSet).length,
        advList: advList,
        slotMap: slotMap
      };
    }

    // build per-day impression series across the active range
    function dayImpressions(rows, range) {
      var counts = {};
      rows.forEach(function (r) {
        if (r.ev !== 'impression') return;
        var k = dayKey(r.t);
        counts[k] = (counts[k] || 0) + 1;
      });

      // determine span: for fixed ranges, fill every day; for 'all', use min..max of data
      var startKey, endKey;
      var today = new Date();
      if (range === 'all') {
        var keys = Object.keys(counts).sort();
        if (!keys.length) return [];
        startKey = keys[0];
        endKey = dayKey(today.getTime());
        // cap 'all' span to avoid an enormous list (max ~60 bars)
        var startT = new Date(startKey + 'T00:00:00').getTime();
        var minStart = today.getTime() - 60 * DAY_MS;
        if (startT < minStart) startKey = dayKey(minStart);
      } else {
        var days = parseInt(range, 10);
        startKey = dayKey(today.getTime() - (days - 1) * DAY_MS);
        endKey = dayKey(today.getTime());
      }

      var out = [];
      var cur = new Date(startKey + 'T00:00:00');
      var end = new Date(endKey + 'T00:00:00');
      var guard = 0;
      while (cur.getTime() <= end.getTime() && guard < 400) {
        var k = dayKey(cur.getTime());
        out.push({ key: k, label: dayLabel(k), count: counts[k] || 0 });
        cur.setDate(cur.getDate() + 1);
        guard++;
      }
      return out;
    }

    // ---------- rendering ----------
    function renderMetrics(a) {
      var html = '' +
        metricCard('총 노출', fmt(a.totalImp), 'accent-gold') +
        metricCard('총 클릭', fmt(a.totalClick), 'accent-terra') +
        metricCard('CTR', ctrText(a.totalClick, a.totalImp), 'accent-blue') +
        metricCard('광고주 수', fmt(a.advCount), '');
      document.getElementById('metrics').innerHTML = html;
    }
    function metricCard(label, value, cls) {
      return '<div class="card metric">' +
        '<div class="m-label">' + esc(label) + '</div>' +
        '<div class="m-value ' + cls + '">' + value + '</div>' +
        '</div>';
    }

    // a row with track + numeric value at the end
    function barLine(tag, value, pct, fillCls) {
      var w = Math.max(0, Math.min(100, pct));
      return '<div class="bar-line">' +
        (tag != null ? '<span class="tag">' + esc(tag) + '</span>' : '') +
        '<span class="track"><span class="fill ' + fillCls + '" style="width:' + w.toFixed(1) + '%"></span></span>' +
        '<span class="val">' + fmt(value) + '</span>' +
        '</div>';
    }

    function renderAdvertisers(a) {
      var maxImp = a.advList.reduce(function (m, x) { return Math.max(m, x.imp); }, 0);

      // bars
      var bars = a.advList.map(function (x) {
        var impPct = maxImp ? (x.imp / maxImp) * 100 : 0;
        var clickPct = maxImp ? (x.click / maxImp) * 100 : 0;
        return '<div class="bar-row">' +
          '<div class="bar-head">' +
            '<span class="bar-name">' + esc(x.name) + '</span>' +
            '<span class="bar-meta">CTR ' + ctrText(x.click, x.imp) + '</span>' +
          '</div>' +
          barLine('노출', x.imp, impPct, 'fill-gold') +
          barLine('클릭', x.click, clickPct, 'fill-terra') +
          '</div>';
      }).join('');

      // table
      var rows = a.advList.map(function (x) {
        return '<tr>' +
          '<td>' + esc(x.name) + '</td>' +
          '<td>' + fmt(x.imp) + '</td>' +
          '<td>' + fmt(x.click) + '</td>' +
          '<td><span class="ctr-pill">' + ctrText(x.click, x.imp) + '</span></td>' +
          '</tr>';
      }).join('');

      return '' +
        '<section class="section">' +
          '<h2>광고주별 성과</h2>' +
          '<div class="sec-sub">노출 많은 순 정렬</div>' +
          '<div class="card">' +
            '<div class="legend"><span><i class="swatch sw-gold"></i> 노출</span><span><i class="swatch sw-terra"></i> 클릭</span></div>' +
            (bars || '<p class="muted-small">데이터가 없습니다.</p>') +
          '</div>' +
          '<div class="card" style="margin-top:12px">' +
            '<div class="tbl-wrap"><table>' +
              '<thead><tr><th>광고주</th><th>노출</th><th>클릭</th><th>CTR</th></tr></thead>' +
              '<tbody>' + (rows || '<tr><td colspan="4" class="muted-small">데이터가 없습니다.</td></tr>') + '</tbody>' +
            '</table></div>' +
          '</div>' +
        '</section>';
    }

    function renderSlots(a) {
      var maxVal = 0;
      SLOT_ORDER.forEach(function (s) {
        maxVal = Math.max(maxVal, a.slotMap[s].imp, a.slotMap[s].click);
      });

      var bars = SLOT_ORDER.map(function (s) {
        var d = a.slotMap[s];
        var impPct = maxVal ? (d.imp / maxVal) * 100 : 0;
        var clickPct = maxVal ? (d.click / maxVal) * 100 : 0;
        return '<div class="bar-row">' +
          '<div class="bar-head">' +
            '<span class="bar-name">' + esc(SLOT_LABELS[s]) + '</span>' +
            '<span class="bar-meta">노출 ' + fmt(d.imp) + ' · 클릭 ' + fmt(d.click) + '</span>' +
          '</div>' +
          barLine('노출', d.imp, impPct, 'fill-gold') +
          barLine('클릭', d.click, clickPct, 'fill-terra') +
          '</div>';
      }).join('');

      var rows = SLOT_ORDER.map(function (s) {
        var d = a.slotMap[s];
        return '<tr>' +
          '<td>' + esc(SLOT_LABELS[s]) + '</td>' +
          '<td>' + fmt(d.imp) + '</td>' +
          '<td>' + fmt(d.click) + '</td>' +
          '</tr>';
      }).join('');

      return '' +
        '<section class="section">' +
          '<h2>슬롯별 노출</h2>' +
          '<div class="sec-sub">광고 위치별 노출·클릭</div>' +
          '<div class="card">' +
            '<div class="legend"><span><i class="swatch sw-gold"></i> 노출</span><span><i class="swatch sw-terra"></i> 클릭</span></div>' +
            bars +
          '</div>' +
          '<div class="card" style="margin-top:12px">' +
            '<div class="tbl-wrap"><table>' +
              '<thead><tr><th>슬롯</th><th>노출</th><th>클릭</th></tr></thead>' +
              '<tbody>' + rows + '</tbody>' +
            '</table></div>' +
          '</div>' +
        '</section>';
    }

    function renderDays(series) {
      var maxC = series.reduce(function (m, x) { return Math.max(m, x.count); }, 0);
      var bars = series.map(function (x) {
        var pct = maxC ? (x.count / maxC) * 100 : 0;
        return '<div class="day-bar">' + barLine(x.label, x.count, pct, 'fill-gold') + '</div>';
      }).join('');

      var totalDays = series.length;
      var totalImp = series.reduce(function (s, x) { return s + x.count; }, 0);

      return '' +
        '<section class="section">' +
          '<h2>일자별 노출</h2>' +
          '<div class="sec-sub">' + totalDays + '일간 · 총 ' + fmt(totalImp) + '회 노출</div>' +
          '<div class="card">' +
            (bars || '<p class="muted-small">표시할 일자 데이터가 없습니다.</p>') +
          '</div>' +
        '</section>';
    }

    function renderEmpty() {
      document.getElementById('report').innerHTML = '';
      var el = document.getElementById('emptyState');
      el.style.display = 'block';
      el.innerHTML = '' +
        '<div class="card empty">' +
          '<div class="big">📊</div>' +
          '<h3>아직 기록된 광고 노출이 없습니다</h3>' +
          '<p>키오스크 게임에서 광고가 노출되면 이 기기에 자동으로 기록됩니다. ' +
          '먼저 둘러보려면 아래 버튼으로 예시 데이터를 채워보세요.</p>' +
          '<button class="btn" id="emptyDemo">데모 데이터 채우기</button>' +
        '</div>';
      var b = document.getElementById('emptyDemo');
      if (b) b.addEventListener('click', fillDemo);
    }

    function updateDemoBadge(log) {
      var hasDemo = log.some(function (r) { return r && r.demo === true; });
      var badge = document.getElementById('demoBadge');
      if (badge) badge.className = 'demo-badge' + (hasDemo ? '' : ' hidden');
    }

    // ---------- top-level render ----------
    function render() {
      var log = loadLog();
      updateDemoBadge(log);

      var rows = filterByRange(log, currentRange);
      var agg = aggregate(rows);

      renderMetrics(agg);

      var emptyEl = document.getElementById('emptyState');
      var reportEl = document.getElementById('report');

      if (log.length === 0) {
        renderEmpty();
        return;
      }
      emptyEl.style.display = 'none';
      emptyEl.innerHTML = '';

      var series = dayImpressions(rows, currentRange);

      if (rows.length === 0) {
        reportEl.innerHTML =
          '<div class="card empty"><div class="big">🗓️</div>' +
          '<h3>선택한 기간에 데이터가 없습니다</h3>' +
          '<p>기간을 “전체”로 바꾸면 모든 기록을 볼 수 있습니다.</p></div>';
        return;
      }

      reportEl.innerHTML =
        renderAdvertisers(agg) +
        renderSlots(agg) +
        renderDays(series);
    }

    // ---------- range buttons ----------
    function setRange(range) {
      currentRange = range;
      var btns = document.querySelectorAll('#rangeControls .btn');
      for (var i = 0; i < btns.length; i++) {
        btns[i].classList.toggle('active', btns[i].getAttribute('data-range') === range);
      }
      render();
    }

    // ---------- CSV export (filtered raw log) ----------
    function exportCsv() {
      var rows = filterByRange(loadLog(), currentRange);
      var header = ['t', 'datetime', 'ev', 'slot', 'slot_label', 'ad', 'adv', 'page', 'kiosk'];
      var lines = [header.join(',')];

      rows.slice().sort(function (a, b) { return a.t - b.t; }).forEach(function (r) {
        var dt = new Date(r.t);
        var iso = dt.getFullYear() + '-' + pad(dt.getMonth() + 1) + '-' + pad(dt.getDate()) +
                  ' ' + pad(dt.getHours()) + ':' + pad(dt.getMinutes()) + ':' + pad(dt.getSeconds());
        var rec = [
          r.t,
          iso,
          r.ev || '',
          r.slot || '',
          SLOT_LABELS[r.slot] || '',
          r.ad || '',
          r.adv || '',
          r.page || '',
          r.kiosk ? 'true' : 'false'
        ];
        lines.push(rec.map(csvCell).join(','));
      });

      var csv = '﻿' + lines.join('\r\n'); // BOM for Excel/Korean
      var blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'studyrush-ad-log-' + currentRange + '-' + dayKey(Date.now()) + '.csv';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    }
    function pad(n) { return n < 10 ? '0' + n : '' + n; }
    function csvCell(v) {
      var s = String(v == null ? '' : v);
      if (/[",\r\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
      return s;
    }

    // ---------- clear ----------
    function clearLog() {
      if (!window.confirm('이 기기에 기록된 광고 로그를 모두 삭제할까요?\n(되돌릴 수 없습니다)')) return;
      try { localStorage.removeItem(LS_KEY); } catch (e) {}
      render();
    }

    // ---------- demo data ----------
    function fillDemo() {
      var advertisers = [
        { name: '메가스터디 학원', ads: ['mega-spring', 'mega-pass'] },
        { name: '동네 분식 김밥천국', ads: ['kimbap-set'] },
        { name: '한빛 안경원', ads: ['hanbit-eye', 'hanbit-event'] }
      ];
      var slots = ['bottom', 'result', 'interstitial'];
      var now = Date.now();
      var demo = [];

      // ~30 impression "sessions", each may yield a click (~8%)
      var targetImpressions = 30;
      for (var i = 0; i < targetImpressions; i++) {
        var adv = advertisers[Math.floor(Math.random() * advertisers.length)];
        var ad = adv.ads[Math.floor(Math.random() * adv.ads.length)];
        var slot = slots[Math.floor(Math.random() * slots.length)];

        // spread over the last ~10 days
        var daysAgo = Math.random() * 10;
        var t = now - daysAgo * DAY_MS - Math.floor(Math.random() * 6 * 60 * 60 * 1000);

        demo.push(makeRec('impression', slot, ad, adv.name, t));

        // ~8% click rate, click happens shortly after impression
        if (Math.random() < 0.08) {
          demo.push(makeRec('click', slot, ad, adv.name, t + Math.floor(Math.random() * 4000) + 800));
        }
      }
      // guarantee at least a couple of clicks so CTR is visible in the demo
      if (!demo.some(function (r) { return r.ev === 'click'; })) {
        var base = demo[0];
        demo.push(makeRec('click', base.slot, base.ad, base.adv, base.t + 1500));
      }

      var log = loadLog();
      // append demo records, keep within the same 800 cap the game uses
      log = log.concat(demo);
      if (log.length > 800) log = log.slice(log.length - 800);
      saveLog(log);

      currentRange = 'all'; // ensure the freshly added range is visible
      setRange('all');
    }

    function makeRec(ev, slot, ad, adv, t) {
      return {
        ev: ev,
        slot: slot,
        ad: ad,
        adv: adv,
        page: 'suneung-quiz',
        kiosk: true,
        t: Math.round(t),
        demo: true
      };
    }

    // ---------- wire up ----------
    document.getElementById('rangeControls').addEventListener('click', function (e) {
      var b = e.target.closest('.btn');
      if (!b) return;
      setRange(b.getAttribute('data-range'));
    });
    document.getElementById('btnCsv').addEventListener('click', exportCsv);
    document.getElementById('btnDemo').addEventListener('click', fillDemo);
    document.getElementById('btnClear').addEventListener('click', clearLog);

    // init
    setRange('7');
  })();
  </script>
</body>
</html>
